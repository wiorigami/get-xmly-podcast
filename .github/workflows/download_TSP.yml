name: Download Ximalaya Podcast（TSP）

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests mutagen

      - name: Run downloader (stable incremental)
        run: |
          python << 'EOF'
          import os, re, json, mimetypes
          import requests
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from mutagen.mp4 import MP4, MP4Cover

          RSS_URL = "https://www.ximalaya.com/album/19206387.xml"
          UA = {"User-Agent": "Mozilla/5.0"}
          OUT = "pod_TSP怪奇档案"
          STATE_FILE = os.path.join(OUT, "_state.json")
          NS = {"itunes": "http://www.itunes.com/dtds/podcast-1.0.dtd"}

          os.makedirs(OUT, exist_ok=True)

          def safe(s):
              return re.sub(r'[\\/:*?"<>|]', '_', s).strip()

          def dl(url, path):
              r = requests.get(url, headers=UA, stream=True, timeout=60)
              r.raise_for_status()
              with open(path, "wb") as f:
                  for c in r.iter_content(1024 * 64):
                      if c:
                          f.write(c)

          # ---------- load state ----------
          if os.path.exists(STATE_FILE):
              state = json.load(open(STATE_FILE, "r", encoding="utf-8"))
          else:
              state = {"last_guid": None}

          xml = requests.get(RSS_URL, headers=UA).content
          root = ET.fromstring(xml)
          items = list(reversed(root.findall("./channel/item")))

          new_items = []
          for item in items:
              guid = item.find("enclosure").attrib["url"]

              if state["last_guid"] and guid == state["last_guid"]:
                  continue

              new_items.append((guid, item))

          if not new_items:
              print("No new episodes.")
              exit()

          print("New episodes:", len(new_items))

          # ---------- download ----------
          def worker(guid, item):
              title = item.findtext("itunes:title", namespaces=NS) or item.findtext("title") or "unknown"
              filename = safe(title) + ".m4a"
              path = os.path.join(OUT, filename)

              if os.path.exists(path):
                  print("[SKIP]", filename)
                  return

              print("[DL]", title)

              url = item.find("enclosure").attrib["url"]
              dl(url, path)

              img = item.find("itunes:image", NS)
              if img is not None:
                  tmp = os.path.join(OUT, "_cover.tmp")
                  dl(img.attrib["href"], tmp)

                  audio = MP4(path)
                  audio["\xa9nam"] = [title]

                  mime = mimetypes.guess_type(img.attrib["href"])[0] or "image/jpeg"
                  fmt = MP4Cover.FORMAT_JPEG if "jpeg" in mime or "jpg" in mime else MP4Cover.FORMAT_PNG

                  with open(tmp, "rb") as f:
                      audio["covr"] = [MP4Cover(f.read(), imageformat=fmt)]

                  audio.save()
                  os.remove(tmp)

          with ThreadPoolExecutor(max_workers=6) as pool:
              pool.map(lambda x: worker(x[0], x[1]), new_items)

          # ---------- update state ----------
          latest_guid = new_items[-1][0]
          with open(STATE_FILE, "w", encoding="utf-8") as f:
              json.dump({"last_guid": latest_guid}, f, ensure_ascii=False, indent=2)

          print("UPDATED STATE:", latest_guid)
          print("DONE")
          EOF

      - name: Commit safely (anti-RPC-fail)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 避免一次 commit 太大导致 RPC fail
          git add pod_TSP怪奇档案/*.m4a || true
          git add pod_TSP怪奇档案/*.json || true

          git commit -m "auto: incremental update" || echo "no changes"

          # 防冲突
          git pull --rebase origin main || true

          # 防 RPC failed（关键）
          git config http.postBuffer 524288000

          git push
